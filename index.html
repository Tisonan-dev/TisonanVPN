<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN · one per location</title>
    <!-- no CSS, plain text output -->
</head>
<body>
    <pre id="output">Loading…</pre>

    <script>
        (async function() {
            const url = 'https://raw.githack.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt';
            const output = document.getElementById('output');

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();

                // split into lines, skip comments and empty
                const lines = text.split(/\r?\n/);
                const vlessLines = lines.filter(line =>
                    line.trim().startsWith('vless://') || line.trim().startsWith('hysteria2://') || line.trim().startsWith('trojan://')
                );

                // map: location (country code / city) → first config
                const locationMap = new Map();

                for (const fullLine of vlessLines) {
                    const trimmed = fullLine.trim();
                    // extract fragment (#…)
                    const hashIndex = trimmed.lastIndexOf('#');
                    let fragment = '';
                    if (hashIndex !== -1) {
                        fragment = trimmed.substring(hashIndex + 1);
                    }

                    // decode percent-encoded fragment to get readable location
                    let decodedFragment = fragment;
                    try {
                        decodedFragment = decodeURIComponent(fragment);
                    } catch (_) { /* keep original */ }

                    // extract location: we look for country emoji + city or country name
                    // typical patterns: "🇵🇱 Poland" or "🇵🇱 Poland, Warsaw" or "🇺🇸 United States, Ashburn"
                    // we'll use the first part after the fragment (or the whole decoded fragment)
                    let locationKey = decodedFragment.trim();
                    if (!locationKey) {
                        // fallback: try to parse from query? but we prefer fragment
                        continue;
                    }

                    // Normalize: remove trailing "| [BL]" or similar, but keep country/city
                    // we want to group by country (and city if available) – but requirement: "по 1 серверу с каждой локации"
                    // "локация" = location, we consider unique fragment (after decoding) as location identifier.
                    // But many fragments have same country but different cities -> we treat each unique fragment as separate location.
                    // However the example shows: "France, Paris" and "France, Paris | 🌐" etc. We want "each location".
                    // To be safe: we use the full decoded fragment as key (after trimming).
                    // But if two lines have identical fragment, we take first.
                    // Also clean up "| [BL]" etc. but keep the rest.
                    // For grouping we use locationKey as is (case-sensitive, emojis preserved)
                    if (!locationMap.has(locationKey)) {
                        // store the first occurrence
                        locationMap.set(locationKey, trimmed);
                    }
                }

                // Build output: we want to show only the configs (one per location)
                // The requested format: show each config as plain text line.
                // No extra wrapper, just the config lines.
                const uniqueConfigs = Array.from(locationMap.values());

                if (uniqueConfigs.length === 0) {
                    output.textContent = 'No valid vless/hysteria/trojan lines found.';
                    return;
                }

                // Join with newline
                output.textContent = uniqueConfigs.join('\n');

            } catch (err) {
                output.textContent = `Error: ${err.message}`;
            }
        })();
    </script>
</body>
</html>
